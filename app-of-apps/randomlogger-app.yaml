apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: random-logger
  namespace: argocd
  labels:
    argocd.argoproj.io/managed-by: app-of-apps
spec:
  project: default
  source:
    repoURL: 'https://github.com/sergiocpmaricato/descomplicando-gitops-no-kubernetes-argocd.git'
    targetRevision: feat/day2
    path: random-logger/helm 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: random-logger
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true